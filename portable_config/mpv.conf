# mpv.conf — RTX 5080 desktop, portable_config
# Philosophy: faithful reconstruction of source, no stylization.

## --- Core video output ---
vo=gpu-next                   # modern GPU-accelerated render pipeline
gpu-api=vulkan                # confirmed working on RTX 5080
hwdec=auto-safe               # curated-whitelist hardware decode
hwdec-extra-frames=10         # avoids shader-chain stalls
vd-lavc-dr=yes                # direct rendering, skips memory copy
profile=high-quality          # mpv's bundled quality defaults
vulkan-async-compute=yes      # async compute queue
vulkan-async-transfer=yes     # async transfer queue
vulkan-queue-count=1          # tested 1/2/3 — all 0 frame drops
video-sync=display-vdrop      # UI responsiveness without audio pitch shift

## --- Downscaling ---
dscale=hermite                # non-ringing/soft scaler (ewa_lanczos in [Res-Downscale])
linear-downscaling=yes        # downscale in linear light
correct-downscaling=yes       # extra correction pass
sigmoid-upscaling=yes         # reduces ringing

## --- Antiringing ---
scale-antiring=0.7            # reduces halo/ringing around high-contrast edges

## --- Debanding & dithering ---
deband=yes                    # compression artifact correction
dither-depth=auto             # matches display bit depth
temporal-dither=yes           # per-frame dither pattern rotation

## --- HDR handling ---
include="C:/mpv/portable_config/hdr-toys.conf"

## --- Subtitles & audio ---
sub-auto=fuzzy                        # load non-exact-match subs
sub-ass-override=no                   # preserve fansub typesetting
sub-ass-style-overrides=Kerning=yes   # letter-spacing fix
sub-ass-scale-with-window=no          # fixed sub position on resize
demuxer-mkv-subtitle-preroll=yes      # correct subs after seek
slang=es,es-ES,es-419,en,eng,jpn,ja,und  # subtitle priority: ES > EN > JA
alang=jpn,ja,eng,en                   # audio priority: JA > EN
audio-normalize-downmix=yes            # stereo downmix for built-in speakers + HyperX

## --- Screenshots ---
screenshot-format=png                              # lossless
screenshot-high-bit-depth=yes                      # full source bit depth
screenshot-tag-colorspace=yes                      # embed colorspace metadata
screenshot-directory="C:/Users/Anxo/Pictures/mpv"  # screenshot output

## --- Behavior ---
keep-open=yes                  # don't close on file end
save-position-on-quit=yes      # resume position
force-window=immediate         # window before first frame
reset-on-next-file=audio-delay,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume,hue,vf,af
cursor-autohide=3000           # 3s autohide
fs=yes                         # start in fullscreen

## --- Auto-playlist ---
autocreate-playlist=filter     # auto-queue folder episodes

## --- Cache ---
gpu-shader-cache-dir="~~/cache/shaders_cache"
watch-later-dir="~~/cache/watch_later"

## --- uosc integration ---
border=no                      # uosc draws its own border
osd-bar=no                     # uosc draws its own timeline

## ==========================================================================================
## Profile blocks — nothing past this line is global
## ==========================================================================================

[Res-SD]
profile-desc=SD/DVD sources (<700p) — ravu-zoom + CfL
profile-cond=height~=nil and height<700
profile-restore=copy
glsl-shaders-append="C:/mpv/portable_config/shaders/ravu-zoom-ar-r3.hook"
glsl-shaders-append="C:/mpv/portable_config/shaders/CfL_Prediction.glsl"

[Res-720p-Clean2x]
profile-desc=720p (700-739p) — exact 2x to 1440p, ArtCNN + CfL
profile-cond=height~=nil and height>=700 and height<740
profile-restore=copy
glsl-shaders-append="C:/mpv/portable_config/shaders/ArtCNN_C4F32.glsl"
glsl-shaders-append="C:/mpv/portable_config/shaders/CfL_Prediction.glsl"

[Res-Fractional]
profile-desc=1080p and fractional ratios (740-1339p) — ravu-zoom + CfL
profile-cond=height~=nil and height>=740 and height<1340
profile-restore=copy
glsl-shaders-append="C:/mpv/portable_config/shaders/ravu-zoom-ar-r3.hook"
glsl-shaders-append="C:/mpv/portable_config/shaders/CfL_Prediction.glsl"

[Res-NearNative]
profile-desc=Near-native (1340-1439p) — CfL only
profile-cond=height~=nil and height>=1340 and height<1440
profile-restore=copy
glsl-shaders-append="C:/mpv/portable_config/shaders/CfL_Prediction.glsl"

[Res-Downscale]
profile-desc=1440p+ (downscale) — ewa_lanczos + CfL
profile-cond=height~=nil and height>=1440
profile-restore=copy
glsl-shaders-append="C:/mpv/portable_config/shaders/CfL_Prediction.glsl"
linear-downscaling=no
dscale=ewa_lanczos

[Colorspace-BT709]
profile-desc=SDR BT.709 — modern HD/web
profile-cond=p["video-params/primaries"]=="bt.709" and p["video-params/gamma"]~="pq" and p["video-params/gamma"]~="hlg"
profile-restore=copy
target-prim=bt.709
target-trc=bt.1886

[Colorspace-NTSC]
profile-desc=SD NTSC — pre-2000s DVD/HDTV
profile-cond=p["video-params/primaries"]=="bt.601-525"
profile-restore=copy
target-prim=bt.601-525
target-trc=bt.1886

[Colorspace-PAL]
profile-desc=SD PAL — European broadcast
profile-cond=p["video-params/primaries"]=="bt.601-625"
profile-restore=copy
target-prim=bt.601-625
target-trc=bt.1886

[gray]
profile-desc=Grayscale/B&W — skip chroma reconstruction
profile-cond=p["video-params/pixelformat"]=="gray"
profile-restore=copy
glsl-shaders-del="C:/mpv/portable_config/shaders/CfL_Prediction.glsl"
glsl-shaders-del="C:/mpv/portable_config/shaders/ArtCNN_C4F32.glsl"
glsl-shaders-del="C:/mpv/portable_config/shaders/ravu-zoom-ar-r3.hook"
dscale=gaussian

[ending]
profile-desc=Final 60 seconds — disable position save
profile-cond=get("duration",0)>0 and get("time-remaining",0)<=60
profile-restore=copy
save-position-on-quit=no
