# mpv.conf - portable, faithful source (no stylization)

# --- Video ---
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
hwdec-extra-frames=10
vd-lavc-dr=yes
profile=high-quality
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1
vulkan-swap-mode=fifo # mailbox breaks vsync estimates across seeks
hdr-compute-peak=no
video-sync=display-vdrop

# --- Scaling ---
scale=spline36
cscale=ewa_lanczossharp
dscale=hermite # mitchell in [Res-Downscale]
linear-downscaling=yes
correct-downscaling=yes
sigmoid-upscaling=yes
sigmoid-center=0.75
sigmoid-slope=6.5
scaler-resizes-only=yes
interpolation=no

# --- Antiring ---
scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7
tscale-antiring=0.7

# --- Deband / dither ---
deband=yes
dither-depth=auto
dither=fruit
temporal-dither=yes
temporal-dither-period=1
fbo-format=rgba16hf

# --- HDR (auto-managed, never edit hdr-toys.conf directly) ---
include="~~/hdr-toys.conf"

# --- Subs / audio ---
sub-auto=fuzzy
sub-ass-override=no
sub-ass-style-overrides=Kerning=yes
sub-ass-scale-with-window=no
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=yes
slang=es-ES,es,spa,es-419,en,eng,jpn,ja,und
alang=jpn,ja,es-ES,es,spa,es-419,eng,en
audio-normalize-downmix=yes

# --- Screenshots ---
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-tag-colorspace=yes
screenshot-directory="~/Pictures/mpv"

# --- Behavior ---
keep-open=yes
save-position-on-quit=yes
force-window=immediate
reset-on-next-file=audio-delay,sub-delay,sub-speed,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,hue,vf,af
cursor-autohide=3000
fs=yes

# --- Playlist / cache / UI ---
autocreate-playlist=filter
gpu-shader-cache-dir="~~/cache/shaders_cache"
watch-later-dir="~~/cache/watch_later"
border=no # uosc draws its own
osd-bar=no # uosc draws its own

# --- Profiles (order matters, maxquality last) ---
include="~~/profiles/res.conf"
include="~~/profiles/colorspace.conf"
include="~~/profiles/maxquality.conf"
