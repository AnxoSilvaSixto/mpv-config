# input.conf — C:\mpv\portable_config\input.conf
# Everything else uses mpv's built-in defaults untouched. Tagged comment lines below (see the syntax
# on any bound line further down) build uosc's right-click menu — needs MBTN_RIGHT bound to open it,
# which is the line directly below. Without that binding, right-click just does mpv's own default.

## --- uosc menu integration: core media commands, menu-only (no dedicated key) ---
## Subtitles/audio already have controls= buttons up top; chapters and open-file don't have any other
## entry point. Right-click was previously showing nothing uosc-related at all - MBTN_RIGHT was never
## bound to uosc's menu command, so this whole file's menu-tag comments had nothing to attach to.
MBTN_RIGHT    script-binding uosc/menu
MENU          script-binding uosc/menu
#  script-binding uosc/subtitles    #! Subtitles
#  script-binding uosc/audio        #! Audio tracks
#  script-binding uosc/chapters     #! Chapters
#  script-binding uosc/open-file    #! Open file

Ctrl+Shift+s no-osd set screenshot-sw yes; screenshot; set screenshot-sw no; show-text "Raw source-frame screenshot saved" #! Diagnostics > Screenshot (raw source frame)

## --- Deband: kept, both genuinely informative (not leftover test scaffolding) ---

# toggles mpv's built-in debanding alone, no shader involved
Alt+d no-osd cycle-values deband "yes" "no"; show-text "Native deband: ${deband}" #! Diagnostics > Deband toggle

# classicjazz-sourced explicit tuning vs bare defaults (bare defaults measurably won, 2.99 vs 25.57 banding
# score) — reload the file to reset, there's no clean single-command revert since the true mpv defaults
# were never independently confirmed. Keybind kept for re-testing; dropped from the right-click menu since
# it's a rejected comparison, not a real option to be offering there.
Alt+g no-osd set deband-iterations 2; set deband-threshold 35; set deband-range 16; set deband-grain 4; show-text "Deband: classicjazz tuning (2:35:16:4) — reload file to reset to bare defaults"

## --- Adopted features: standing tools, not tests ---

# opt-in denoise for genuinely noisy/old sources specifically — confirmed real benefit (SSIM 0.57->0.82 on
# synthetic noise) but never a standing default; must run before any upscaler in the chain, which is why
# these use "pre" instead of "append"
Alt+n no-osd change-list glsl-shaders pre "C:/mpv/portable_config/shaders/nlmeans.glsl"; show-text "nlmeans: ON (prepended before upscaler)" #! Diagnostics > Denoise > On
Alt+Shift+n no-osd change-list glsl-shaders del "C:/mpv/portable_config/shaders/nlmeans.glsl"; show-text "nlmeans: OFF" #! Diagnostics > Denoise > Off

# manual fallback to native tone-mapping if hdr-toys (the actual default for bt.2020+PQ/HLG content, see
# mpv.conf) ever looks wrong on something — not a formal A/B anymore, just an escape hatch. Fixed
# 2026-08-25: del list now covers all 9 shaders used across all 4 hdr-toys profiles (was hardcoded
# to just the 5 the PQ profile loads, so triggering this on HLG/bt.2020/linear content used to leave
# that profile's own shader still active). change-list del on a path that was never loaded is a
# harmless no-op, so listing all 9 unconditionally is safe regardless of which profile is active.
Alt+h no-osd change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/utils/clip_both.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/utils/clip_black.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/utils/clip_alpha.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/transfer-function/pq_inv.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/transfer-function/hlg_inv.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/transfer-function/bt1886_inv.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/tone-mapping/astra.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/gamut-mapping/jedypod.glsl"; change-list glsl-shaders del "C:/mpv/portable_config/shaders/hdr-toys/transfer-function/bt1886.glsl"; set target-colorspace-hint yes; set tone-mapping spline; set gamut-mapping-mode auto; show-text "hdr-toys OFF -- native tone-mapping restored (reload file to bring hdr-toys back)" #! Diagnostics > HDR (use native tone-mapping)

## --- Still genuinely open ---

# the one test never actually closed — only visibly differs on HDR-sourced files, e.g. the Dolby Vision remux.
# Keybind kept for continuing that comparison; dropped from the right-click menu since it's an unresolved
# personal test, not a real option to be offering there.
Alt+t no-osd cycle-values tone-mapping "spline" "bt.2446a"; show-text "tone-mapping: ${tone-mapping}"
