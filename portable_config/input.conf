# input.conf - portable. #! lines build the uosc right-click menu.

# --- uosc menu (MBTN_RIGHT required, else menu has nothing to attach to) ---
MBTN_RIGHT    script-binding uosc/menu
MENU          script-binding uosc/menu
#  script-binding uosc/subtitles    #! Subtitles
#  script-binding uosc/audio        #! Audio tracks
#  script-binding uosc/chapters     #! Chapters
#  script-binding uosc/open-file    #! Open file

# --- Chapters (playlist-aware at ends) ---
z script-binding media/chapter_next #! Chapters > Next chapter (playlist-aware)
Z script-binding media/chapter_prev #! Chapters > Previous chapter (playlist-aware)

# --- Tracks (keyboard fallback when uosc is down) ---
Ctrl+a no-osd cycle audio; show-text "Audio track: ${aid} (${audio-params/lang})" #! Audio tracks > Next audio (keyboard fallback)
Ctrl+A no-osd cycle audio down; show-text "Audio track: ${aid} (${audio-params/lang})" #! Audio tracks > Previous audio (keyboard fallback)
Ctrl+s no-osd cycle sub; show-text "Subtitle track: ${sid} (${sub-lang})" #! Subtitles > Next subtitle (keyboard fallback)
Ctrl+S no-osd cycle sub down; show-text "Subtitle track: ${sid} (${sub-lang})" #! Subtitles > Previous subtitle (keyboard fallback)

# --- Sub timing (two-point fix: sync early, mark, sync late, mark) ---
Ctrl+z no-osd sub-step -1; show-text "Sub timing: step -1" #! Subtitles > Step earlier (timing fix)
Ctrl+x no-osd sub-step 1; show-text "Sub timing: step +1" #! Subtitles > Step later (timing fix)
Ctrl+/ no-osd script-binding media/sub-set-time; show-text "Sub timing: point marked" #! Subtitles > Mark sync point (two-point fix)

Ctrl+Shift+s no-osd set screenshot-sw yes; screenshot; set screenshot-sw no; show-text "Raw source-frame screenshot saved" #! Diagnostics > Screenshot (raw source frame)

# --- Deband / denoise / HDR / quality ---
Alt+d no-osd cycle-values deband "yes" "no"; show-text "Native deband: ${deband}" #! Diagnostics > Deband toggle
Alt+n no-osd change-list glsl-shaders pre "~~/shaders/nlmeans.glsl"; show-text "nlmeans: ON (prepended before upscaler)" #! Diagnostics > Denoise > On
Alt+Shift+n no-osd change-list glsl-shaders del "~~/shaders/nlmeans.glsl"; show-text "nlmeans: OFF" #! Diagnostics > Denoise > Off
Alt+h script-binding hdr-toggle #! Diagnostics > HDR (use native tone-mapping)
Alt+q no-osd script-message-to quality_toggle toggle-maxq #! Diagnostics > Quality > MaxQuality toggle

# Open HDR comparison (HDR files only).
Alt+t no-osd cycle-values tone-mapping "spline" "bt.2446a"; show-text "tone-mapping: ${tone-mapping}"
