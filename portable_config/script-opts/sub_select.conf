# script-opts/sub_select.conf — only one value changed from the script's real default (shown below).
# Full default file: https://raw.githubusercontent.com/CogentRedTester/mpv-sub-select/master/sub_select.conf

# re-evaluate subtitle selection if you manually switch audio tracks mid-file (e.g. JP -> a Spanish
# dub, if one exists) — default is "no"; "yes" is what makes the Spanish-only rule actually reactive
# instead of only applying at file-load time
observe_audio_switches=yes

# everything below is left at the script's real default — listed for visibility, not because
# these need to be here (comment/uncomment has no effect either way)
# force_enable=no
# select_audio=no
# explicit_forced_subs=no
# config=~~/script-opts
