# thumbfast.conf - non-defaults: 400px preview, mobius tonemap, hwdec, direct_io

socket=
thumbnail=
max_height=400
max_width=400
scale_factor=1
# not auto: thumbnailer runs --no-config, auto would read a placeholder
tone_mapping=mobius
overlay_id=42
spawn_first=yes
quit_after_inactivity=0
network=no
audio=no
hwdec=yes
# fails safe without LuaJIT/FFI
direct_io=yes
# resolves to running mpv.exe via process-path
mpv_path=mpv
