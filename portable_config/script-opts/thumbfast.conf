# thumbfast.conf -> goes in C:\mpv\portable_config\script-opts\thumbfast.conf
#
# Every value below is checked against the real po5/thumbfast source (thumbfast.lua) and its
# own shipped thumbfast.conf template as of today, not assumed from memory. Defaults are
# thumbfast's stock values; changes are explained inline.

# Socket path (leave empty for auto)
socket=

# Thumbnail path (leave empty for auto)
thumbnail=

# Maximum thumbnail generation size in pixels, scaled down to fit.
# Raised from the 200x200 default: that default targets hardware with a real decode/CPU
# ceiling. A single still-frame decode+scale is trivial for an RTX 5080, so there's room to
# push this higher for a visibly sharper hover preview. Pure taste above this line.
max_height=400
max_width=400

# Scale factor for thumbnail display size (requires mpv 0.38+).
# Left at default: this upsamples the already-generated thumbnail rather than generating a
# sharper one, so it's strictly worse than the max_height/max_width increase above.
scale_factor=1

# Apply tone-mapping, "no" to disable.
# Changed from "auto": thumbfast spawns its thumbnail subprocess with --no-config (confirmed
# in its source), so it never loads mpv.conf or a shader-based HDR chain like hdr-toys - "auto"
# just reads back whatever your MAIN mpv instance's tone-mapping property currently is and
# re-applies it through a plain ffmpeg zscale filter. If your hdr-toys setup uses a
# placeholder/sentinel value for that property to hand real tone-mapping off to a shader
# (a common pattern), "auto" would pick up the placeholder literally instead of anything close
# to what hdr-toys actually renders. Set to a real curve instead so hover-thumbnails on an
# actual HDR file get an honest tonemap. Worth a quick spot-check against a real HDR file once
# thumbfast is running, either way - I haven't verified this against your specific mpv.conf.
tone_mapping=mobius

# Overlay id. Left at default - no reason to change unless it collides with another script.
overlay_id=42

# Spawn thumbnailer on file load for faster initial thumbnails, instead of waiting for the
# first hover. Enabled: the upfront cost is trivial on this hardware, and it removes the short
# delay on the very first hover of each file.
spawn_first=yes

# Close thumbnailer process after an inactivity period in seconds, 0 to disable.
# Left at 0 - no real reason to reclaim that bit of idle memory on a desktop.
quit_after_inactivity=0

# Enable on network playback. Left off - flip to yes if you watch remote streams through mpv
# and want hover thumbnails there too.
network=no

# Enable on audio playback. Left off unless you play audio files through this install too.
audio=no

# Enable hardware decoding for the thumbnailer's OWN subprocess (passes --hwdec=auto to it,
# per thumbfast's source - independent of whatever --hwdec mode mpv.conf uses for real
# playback). This is a disposable, isolated single-frame decode: worst case one thumbnail is
# slow or missing, never a playback problem - reasonable to enable for speed on this GPU.
hwdec=yes

# Windows-only: write directly to the pipe (requires LuaJIT).
# Verified in thumbfast's own source that this fails safe if LuaJIT/FFI isn't available
# (silently falls back, doesn't error) - safe to enable regardless. Most current Windows mpv
# builds ship with LuaJIT by default, so this should just work.
direct_io=yes

# Custom path to the mpv executable thumbfast spawns to generate thumbnails.
# Left at the default "mpv" deliberately: on Windows, thumbfast's own source resolves this
# through the running mpv's `user-data/frontend/process-path` property when left as "mpv",
# finding the exact running mpv.exe regardless of PATH. No override needed.
mpv_path=mpv
