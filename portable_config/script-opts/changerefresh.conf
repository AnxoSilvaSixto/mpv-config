# changerefresh.conf - refresh-rate matching (calls tools/Set-RefreshRate.ps1)

# 165 must stay - revert needs the native desktop rate in this list.
rates=23;24;25;29;30;50;59;60;144;165
auto=yes
pause=3
bdepth=32
estimated_fps=no
detect_display_resolution=yes
original_width=2560
original_height=1440
# 0 = revert to actual original, not a fixed override
original_rate=0
UHD_adaptive=no
UHD_threshold=1440
UHD_width=3840
UHD_height=2160
osd_output=yes
