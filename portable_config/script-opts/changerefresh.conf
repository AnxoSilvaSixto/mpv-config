# script-opts/changerefresh.conf — based on CogentRedTester/mpv-changerefresh's real defaults, with
# values changed for this machine noted below. The nircmd path option is gone entirely — the paired
# change-refresh.lua now calls Set-RefreshRate.ps1 (tools/Set-RefreshRate.ps1) directly, no separate
# tool path to configure here.

#list of valid refresh rates, separated by semicolon, listed in ascending order
#nircmd/PowerShell both only work with integers, so 23.976fps content maps to 23, 29.97 maps to 29, etc.
#165 is included specifically so the script can correctly revert to your desktop's native rate —
#it MUST be in this list for reverting to work correctly, per the script's own logic
rates=23;24;25;29;30;50;59;60;165

#CHANGED from false: automatically match refresh rate on every file load, since that's what you asked for —
#no need to press f10 manually. Ctrl+f10 still reverts on demand if you ever want to override it mid-session
auto=yes

#duration (in seconds) of the pause when changing display modes, avoids an A/V desync during the switch
pause=3

#colour bit depth passed through to Set-RefreshRate.ps1
bdepth=32

#container fps (not estimated) — container-fps is the file's declared rate, matches how the rest of this
#config already reasons about source fidelity rather than measured/estimated playback behavior
estimated_fps=no

#auto-detect monitor resolution so reverting restores the exact resolution too, not just refresh rate
detect_display_resolution=yes
original_width=1920
original_height=1080

#0 = always revert to whatever the actual original rate was (not a fixed override)
original_rate=0

#UHD adaptive resolution switching — not what was asked for here (this is refresh-rate matching, not
#resolution switching), left off
UHD_adaptive=no
UHD_threshold=1440
UHD_width=3840
UHD_height=2160

#status messages on screen when the rate changes — useful for confirming it's actually working at first,
#turn to "no" later if it gets noisy
osd_output=yes
