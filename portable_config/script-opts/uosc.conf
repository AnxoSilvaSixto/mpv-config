# uosc.conf — NieR:Automata theme, floating bar

## Timeline
timeline_style=line
timeline_line_width=2
timeline_size=40
timeline_border=1
timeline_step=5
timeline_cache=yes
timeline_heatmap=overlay
progress=always
progress_size=2
progress_line_width=20

## Controls
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,gap,space,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=10
controls_spacing=4
controls_persistency=
volume=right
volume_size=40
volume_border=1
volume_step=1
volume_persistency=
speed_step=0.1
speed_step_is_factor=no
speed_persistency=

## Menu
menu_item_height=36
menu_min_width=260
menu_padding=4
menu_type_to_search=yes

## Top bar
top_bar=no-border
top_bar_size=40
top_bar_controls=right
top_bar_title=yes
top_bar_alt_title_place=below
top_bar_flash_on=video,audio

## Window border
window_border_size=1

## General
autoload=no
shuffle=no
scale=1.2
scale_fullscreen=1.56
font_scale=1
text_border=1.2
border_radius=4
refine=sorting
animation_duration=100
flash_duration=1000
proximity_in=40
proximity_out=120
font_bold=no
destination_time=total
time_precision=0
buffered_time_threshold=60
autohide=yes
pause_indicator=flash
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt
playlist_types=m3u,m3u8,pls,url,cue
load_types=video,audio,image
default_directory=~/
show_hidden_files=no
use_trash=yes
adjust_osd_margins=yes

## Colors — NieR:Automata palette (improved contrast)
# foreground: warm beige for text on dark backgrounds
# foreground_text: dark brown for text on light backgrounds
# background: dark brown for UI panels
# background_text: warm beige for text on dark panels
# curtain: mid beige for menu backdrop
# success: muted green
# error: muted red
# match: warm amber for highlighted items
# heatmap: warm gold
color=foreground=e8dcc7,foreground_text=3a3528,background=3a3528,background_text=e8dcc7,curtain=c8c2aa,success=6a9f3e,error=c44536,match=c9944b,heatmap=b8943e

## Opacity — floating bar approximation
opacity=timeline=0.85,controls=0.85,border=0.5

## Chapter ranges — NieR palette tones
chapter_ranges=openings:c9c2ab73,endings:af8f6a73,intros:9c5a3f73,outros:8a624873,ads:c54e4e80
chapter_range_patterns=openings:opening, op ,♪ op,♪op,^op$,op%d,theme song,main theme,オープニング,オープニングテーマ,OPテーマ,主題歌,ncop,creditless op,creditless opening;endings:ending, ed ,♪ ed,♪ed,^ed$,ed%d,credits,outro,end roll,エンディング,エンディングテーマ,EDテーマ,結び,nced,creditless ed,creditless ending;outros:preview, pv ,^pv$,pv%d,trailer,next episode,予告,次回予告,特報,プロモーション,jikai,yokoku;intros:intro,introduction,prologue,cold open,アバン,アバンタイトル,序章,前説

## Localization
languages=slang,en
subtitles_directory=~~/subtitles

## Disabled elements
disable_elements=
