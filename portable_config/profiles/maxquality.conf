# maxquality.conf - opt-in via Alt+q (off by default)

[MaxQuality]
profile-desc=MaxQuality - sharper scalers + stronger deband (Alt+q)
profile-cond=get("user-data/maxq","no")=="yes"
profile-restore=copy
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=ewa_lanczos
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=48
