# profiles/maxquality.conf — included by mpv.conf (after colorspace)
# Opt-in MaxQuality track (Alt+q): slightly enhanced over faithful defaults.
# Off by default (user-data/maxq != "yes"); toggle with Alt+q in input.conf.
# Faithful profile stays default; this stacks sharper scalers + stronger deband.

[MaxQuality]
profile-desc=Max quality opt-in — ewa_lanczossharp + stronger deband (Alt+q toggle)
profile-cond=get("user-data/maxq","no")=="yes"
profile-restore=copy
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=ewa_lanczos
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=48
