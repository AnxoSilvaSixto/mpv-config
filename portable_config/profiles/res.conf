# res.conf - resolution profiles (SD -> 720p -> fractional -> near-native -> downscale)

[Res-SD]
profile-desc=SD (<700p) - ArtCNN_C4F16 + CfL + SSimSuperRes
# Noisy DVDs: swap ArtCNN_C4F16 -> ArtCNN_C4F16_DN, or Alt+n nlmeans.
profile-cond=height~=nil and height<700
profile-restore=copy
glsl-shaders-append="~~/shaders/ArtCNN_C4F16.glsl"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[Res-720p-Clean2x]
profile-desc=720p (700-739p) - exact 2x, ArtCNN_C4F32 + CfL + SSimSuperRes
# Bucket covers 704p/738p too - don't narrow without visual A/B.
profile-cond=height~=nil and height>=700 and height<740
profile-restore=copy
glsl-shaders-append="~~/shaders/ArtCNN_C4F32.glsl"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[Res-Fractional]
profile-desc=Fractional (740-1339p) - ravu + CfL + SSimSuperRes
profile-cond=height~=nil and height>=740 and height<1340
profile-restore=copy
glsl-shaders-append="~~/shaders/ravu-zoom-ar-r4.hook"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[Res-NearNative]
profile-desc=Near-native (1340-1439p) - CfL + SSimSuperRes
profile-cond=height~=nil and height>=1340 and height<1440
profile-restore=copy
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[Res-Downscale]
profile-desc=Downscale (1440p+) - mitchell + CfL + SSimDownscaler
profile-cond=height~=nil and height>=1440
profile-restore=copy
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"
dscale=mitchell
