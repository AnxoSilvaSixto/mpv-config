# profiles/res.conf — included by mpv.conf
# Resolution-based profiles; order matters (SD -> 720p -> Fractional -> NearNative -> Downscale)

[Res-SD]
profile-desc=SD/DVD sources (<700p) — ravu-zoom + CfL + SSim
profile-cond=height~=nil and height<700
profile-restore=copy
glsl-shaders-append="~~/shaders/ravu-zoom-ar-r4.hook"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"

[Res-720p-Clean2x]
profile-desc=720p (700-739p) — exact 2x to 1440p, ArtCNN + CfL + SSim
profile-cond=height~=nil and height>=700 and height<740
profile-restore=copy
glsl-shaders-append="~~/shaders/ArtCNN_C4F32.glsl"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"

[Res-Fractional]
profile-desc=1080p and fractional ratios (740-1339p) — ravu-zoom + CfL + SSim
profile-cond=height~=nil and height>=740 and height<1340
profile-restore=copy
glsl-shaders-append="~~/shaders/ravu-zoom-ar-r4.hook"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"

[Res-NearNative]
profile-desc=Near-native (1340-1439p) — CfL + SSim (minimal upscale)
profile-cond=height~=nil and height>=1340 and height<1440
profile-restore=copy
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"

[Res-Downscale]
profile-desc=1440p+ (downscale) — ewa_lanczos + CfL + SSimDownscaler
profile-cond=height~=nil and height>=1440
profile-restore=copy
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"
linear-downscaling=no
dscale=ewa_lanczos
