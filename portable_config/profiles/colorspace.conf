# colorspace.conf - BT709 / NTSC / PAL / gray / ending

[Colorspace-BT709]
profile-desc=SDR BT.709
profile-cond=p["video-params/primaries"]=="bt.709" and p["video-params/gamma"]~="pq" and p["video-params/gamma"]~="hlg"
profile-restore=copy
target-prim=bt.709
target-trc=bt.1886

[Colorspace-NTSC]
profile-desc=SD NTSC
profile-cond=p["video-params/primaries"]=="bt.601-525"
profile-restore=copy
target-prim=bt.601-525
target-trc=bt.1886

[Colorspace-PAL]
profile-desc=SD PAL
profile-cond=p["video-params/primaries"]=="bt.601-625"
profile-restore=copy
target-prim=bt.601-625
target-trc=bt.1886

[gray]
profile-desc=Grayscale - skip chroma
profile-cond=p["video-params/pixelformat"]=="gray"
profile-restore=copy
glsl-shaders-del="~~/shaders/CfL_Prediction.glsl"
dscale=hermite

[ending]
profile-desc=Last 60s - no position save
profile-cond=get("duration",0)>0 and get("time-remaining",0)<=60
profile-restore=copy
save-position-on-quit=no
