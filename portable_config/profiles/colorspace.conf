# profiles/colorspace.conf — included by mpv.conf
# Colorspace + utility profiles; order matters (BT709 -> NTSC -> PAL -> gray -> ending)

[Colorspace-BT709]
profile-desc=SDR BT.709 — modern HD/web
profile-cond=p["video-params/primaries"]=="bt.709" and not p["video-params/gamma"] ~ "pq" and not p["video-params/gamma"] ~ "hlg"  # SDR only: excludes pq/hlg (fixed ambiguous ~=; validated spaces)
profile-restore=copy
target-prim=bt.709
target-trc=bt.1886

[Colorspace-NTSC]
profile-desc=SD NTSC — pre-2000s DVD/HDTV
profile-cond=p["video-params/primaries"]=="bt.601-525"
profile-restore=copy
target-prim=bt.601-525
target-trc=bt.1886

[Colorspace-PAL]
profile-desc=SD PAL — European broadcast
profile-cond=p["video-params/primaries"]=="bt.601-625"
profile-restore=copy
target-prim=bt.601-625
target-trc=bt.1886

[gray]
profile-desc=Grayscale/B&W — skip chroma reconstruction
profile-cond=p["video-params/pixelformat"]=="gray"
profile-restore=copy
glsl-shaders-del="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-del="~~/shaders/ArtCNN_C4F32.glsl"
glsl-shaders-del="~~/shaders/ravu-zoom-ar-r4.hook"
glsl-shaders-del="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-del="~~/shaders/SSimDownscaler.glsl"
dscale=gaussian

[ending]
profile-desc=Final 60 seconds — disable position save
profile-cond=get("duration",0)>0 and get("time-remaining",0)<=60
profile-restore=copy
save-position-on-quit=no
